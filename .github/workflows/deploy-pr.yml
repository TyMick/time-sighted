name: Deploy PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: gh-pages
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish PR preview to gh-pages
        run: |
          PR_DIR="pr-${{ github.event.pull_request.number }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp index.html /tmp/index.html

          git fetch origin

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout -b local-gh-pages origin/gh-pages
          else
            git checkout --orphan local-gh-pages
            git rm -rf . > /dev/null 2>&1 || true
          fi

          mkdir -p "$PR_DIR"
          cp /tmp/index.html "$PR_DIR/index.html"
          git add "$PR_DIR/"

          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi

          git commit -m "Deploy PR #${{ github.event.pull_request.number }} preview"
          git push origin local-gh-pages:gh-pages

      - name: Post preview URL comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const url = `https://${owner}.github.io/${repo}/pr-${prNumber}/`;
            const marker = '<!-- gh-pages-preview -->';
            const body = `${marker}\n**Preview:** ${url}`;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
            });

            const existing = comments.data.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
            }
