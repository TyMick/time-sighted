name: Deploy main

on:
  push:
    branches: [main]

concurrency:
  group: gh-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp index.html style.css script.js /tmp/

          git fetch origin

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout -b local-gh-pages origin/gh-pages
          else
            git checkout --orphan local-gh-pages
            git rm -rf . > /dev/null 2>&1 || true
          fi

          cp /tmp/index.html /tmp/style.css /tmp/script.js .
          git add index.html style.css script.js

          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi

          git commit -m "Deploy main @ ${GITHUB_SHA::7}"
          git push origin local-gh-pages:gh-pages
