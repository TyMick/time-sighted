<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f5f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
<title>Time Sighted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <span class="wordmark">Time Sighted</span>
  <div class="header-right">
    <button class="export-btn" onclick="exportCSV()">↓ CSV</button>
    <button class="clear-btn" onclick="clearAll()">✕</button>
  </div>
</header>

<div class="input-zone">
  <div class="input-label">What are you switching to?</div>
  <div class="input-row">
    <textarea id="task-input" rows="1" autocomplete="off" autocorrect="on" spellcheck="true"></textarea>
    <button id="log-btn" onclick="logEntry()">↵</button>
  </div>
</div>

<div class="timeline-wrap" id="timeline">
  <div class="empty-state" id="empty">
    <div class="icon">◎</div>
    <p>No entries yet</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
